[versions]
app-version-code = "5"
app-version-name = "1.1.1"
agp = "9.1.0"
android-compileSdk = "37"
android-minSdk = "26"
android-targetSdk = "36"
androidx-activity = "1.12.2"
androidx-lifecycle = "2.9.6"
composeHotReload = "1.0.0"
composeMultiplatform = "1.10.0"
kotlin = "2.4.0"
ksp = "2.3.5"
room = "2.8.4"
sqlite = "2.6.2"
kotlinx-coroutines = "1.10.2"
material3 = "1.10.0-alpha05"
datastore = "1.2.1"
koin = "4.2.0"
navigation = "2.9.2"
biometric = "1.1.0"
datetime = "0.7.1"
icons = "1.7.3"
backhandler = "1.1.1"
filekt = "0.16.0"
serialization_json = "1.11.0"
serialization_yaml = "0.13.0"
serialization_xml = "1.0.2.1"
zip = "1.0.0"
mockk = "1.14.11"
workmanager = "3.5.0"
documentfile = "1.1.0"
splashscreen = "1.2.0"
sentry = "6.23.0"
sentry_sdk = "8.58.0"

[libraries]

#
# Kotlin libraries
#
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-coroutines = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlin-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
kotlin-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }

#
# Android libraries
#
android-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
android-compose-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
android-compose-lifecycle = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
android-sqlite-driver = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }
android-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
android-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
android-datastore = { module = "androidx.datastore:datastore", version.ref = "datastore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
android-biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
android-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "splashscreen" }

#
# Compose libraries
#
compose-runtime = { module = "org.jetbrains.compose.runtime:runtime", version.ref = "composeMultiplatform" }
compose-foundation = { module = "org.jetbrains.compose.foundation:foundation", version.ref = "composeMultiplatform" }
compose-ui = { module = "org.jetbrains.compose.ui:ui", version.ref = "composeMultiplatform" }
compose-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "composeMultiplatform" }
compose-navigation = { module = "org.jetbrains.androidx.navigation:navigation-compose", version.ref = "navigation" }
compose-backhandler = { module = "androidx.navigationevent:navigationevent-compose", version.ref = "backhandler" }

#
# Material libraries
#
material-icons = { group = "org.jetbrains.compose.material", name = "material-icons-extended", version.ref = "icons" }
material = { module = "org.jetbrains.compose.material3:material3", version.ref = "material3" }
material-windowsizeclass = { group = "org.jetbrains.compose.material3", name = "material3-window-size-class", version.ref = "material3" }

#
# Koin libraries
#
koin = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { group = "io.insert-koin", name = "koin-compose-viewmodel", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }

#
# Filekit libraries
#
filekt-core = { module = "io.github.vinceglb:filekit-core", version.ref = "filekt" }
filekt-dialogs = { module = "io.github.vinceglb:filekit-dialogs", version.ref = "filekt" }
filekt-dialogs-compose = { module = "io.github.vinceglb:filekit-dialogs-compose", version.ref = "filekt" }

#
# Serialization libraries
#
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization_json" }
serialization-json-io = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json-io", version.ref = "serialization_json" }
serialization-yaml = { module = "net.mamoe.yamlkt:yamlkt", version.ref = "serialization_yaml" }
serialization-xml-core = { module = "io.github.pdvrieze.xmlutil:core", version.ref = "serialization_xml" }
serialization-xml-io = { module = "io.github.pdvrieze.xmlutil:serialization-io", version.ref = "serialization_xml" }
serialization-xml = { module = "io.github.pdvrieze.xmlutil:serialization", version.ref = "serialization_xml" }

#
# Zip libraries
#
zip = { module = "no.synth:kmp-zip", version.ref = "zip" }
zip-kotlinx = { module = "no.synth:kmp-zip-kotlinx", version.ref = "zip" }

#
# Miscellaneous libraries
#
mockk = { module = "io.mockk:mockk-jvm", version.ref = "mockk" }
workmanager = { module = "dev.brewkits:kmpworkmanager", version.ref = "workmanager" }
sentry = { module = "io.sentry:sentry-android", version.ref = "sentry_sdk" }

#
# Build plugins
#
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }

[bundles]
# Bundles libraries that extend the domain of the app.
library-common-main = ["kotlin-coroutines", "koin", "kotlin-datetime", "filekt-core"]
library-common-test = ["kotlin-test"]
library-android-main = ["koin-android"]

compose-common-main = [
    "compose-runtime",
    "compose-foundation",
    "compose-ui",
    "compose-resources",
    "material",
    "material-windowsizeclass",
    "material-icons",
    "koin-compose",
    "koin-compose-viewmodel",
    "android-compose-viewmodel",
    "android-compose-lifecycle",
    "compose-navigation",
    "filekt-dialogs",
    "filekt-dialogs-compose",
]
compose-android-main = ["android-activity-compose"]
compose-jvm-main = ["kotlin-coroutines-swing"]

[plugins]

#
# Android plugins
#
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-lint = { id = "com.android.lint", version.ref = "agp" }
android-room = { id = "androidx.room", version.ref = "room" }

#
# Compose plugins
#
compose-hotreload = { id = "org.jetbrains.compose.hot-reload", version.ref = "composeHotReload" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

#
# Kotlin plugins
#
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }

#
# Miscellaneous plugins
#
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sentry = { id = "io.sentry.android.gradle", version.ref = "sentry" }